[project]
name = "project-starter-api"
version = "0.1.0"
description = "A small, typed API boundary for the project starter."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.14,<1", "mypy>=1.18,<2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.fastapi]
entrypoint = "app.main:app"
